name: compliance_training_app
description: Flutter demo client for the compliance & safety training platform MVP.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  flutter_animate: ^4.4.0
  go_router: ^13.1.0
  flutter_markdown: ^0.6.17+5
  collection: ^1.18.0
  flutter_localizations:
    sdk: flutter
  video_player: ^2.8.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/quiz_fallback.png
